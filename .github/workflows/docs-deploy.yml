name: Update Docs and Deploy Mike
#test
on:
  push:
    branches:
      - "[0-9]*.[0-9]*.[0-9]*"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 1. Replaced 'mike' with the Zensical-compatible fork
          pip install zensical mkdocs-material packaging mkdocs git+https://github.com/squidfunk/mike.git

      - name: Run stats generator script & validate version format
        run: python stats-generator.py

      - name: Configure Git Credentials
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit updated files back to repository
        run: |
          git add docs/index.md -f docs/GENERATED-STATS.md
          if ! git diff --staged --quiet; then
            git commit -m "docs: auto-update documentation stats [skip ci]"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push
          fi

      - name: Build documentation with Zensical
        run: zensical build

      - name: Read Target Version and Deploy with Mike
        run: |
          git fetch origin gh-pages:gh-pages || true
          
          VERSION=$(cat TARGET_VERSION.txt | tr -d '[:space:]')
          echo "Deploying documentation for version: $VERSION"
          
          # 2. Removed --config-file zensical.yml so it defaults to mkdocs.yml
          mike deploy --push --update-aliases "$VERSION" latest
          mike set-default --push latest