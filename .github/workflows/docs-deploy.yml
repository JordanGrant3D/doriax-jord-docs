name: Update Docs and Deploy Mike

on:
  push:
    branches:
      - '*'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install zensical mkdocs-material mike packaging mkdocs

      - name: Run stats generator script & validate version format
        run: python stats-generator.py

      - name: Configure Git Credentials
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit updated index.md back to repository
        run: |
          git add docs/index.md
          git diff --staged --quiet || git commit -m "docs: auto-update documentation stats [skip ci]"
          git push

      - name: Read Target Version and Deploy with Mike
        run: |
          # Read version from TARGET_VERSION.txt and strip trailing whitespace/newlines
          VERSION=$(cat TARGET_VERSION.txt | tr -d '[:space:]')
          
          echo "Deploying documentation for version: $VERSION"
          
          # Deploy using mkdocs.yml explicitly and update the latest alias
          mike deploy --config-file mkdocs.yml --push --update-aliases "$VERSION" latest
          
          # Ensure the root URL redirects to latest
          mike set-default --config-file mkdocs.yml --push latest