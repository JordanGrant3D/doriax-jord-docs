name: Update Docs and Deploy MkDocs

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material packaging mkdocs

      - name: Run stats generator script & validate version format
        run: python stats-generator.py

      - name: Commit updated index.md back to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.md
          git diff --staged --quiet || git commit -m "docs: auto-update documentation stats [skip ci]"
          git push

      - name: Deploy MkDocs to GitHub Pages
        run: mkdocs gh-deploy --force