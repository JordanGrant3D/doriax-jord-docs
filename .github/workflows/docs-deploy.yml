name: Update Docs and Deploy Mike

on:
  push:
    branches:
      - '*'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install zensical mike packaging

      - name: Run stats generator script & validate version format
        run: python stats-generator.py

      - name: Configure Git Credentials
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit updated index.md back to repository
        run: |
          git add docs/index.md
          git diff --staged --quiet || git commit -m "docs: auto-update documentation stats [skip ci]"
          git push

          - name: Read Target Version and Deploy with Mike
              run: |
                VERSION=$(cat TARGET_VERSION.txt | tr -d '[:space:]')
                
                echo "Deploying documentation for version: $VERSION"
                
                # Deploy using default mkdocs.yml configuration
                mike deploy --push --update-aliases "$VERSION" latest
                
                # Set default redirect to latest
                mike set-default --push latest